<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki — Fundamentos de IA Productiva</title>
<style>
  :root{
    --bg:#0e1117;
    --bg-2:#161b22;
    --bg-3:#1c2330;
    --border:#2a3340;
    --text:#e6edf3;
    --muted:#bcc8d4;
    --accent:#58a6ff;
    --accent-2:#7ee787;
    --warn:#f0a868;
    --danger:#ff7b72;
    --analogy:#bc8cff;
    --code-bg:#0a0d12;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65;
  }
  a{color:var(--accent);}

  /* ---- Top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(14,17,23,.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 24px;
    display:flex;align-items:center;gap:16px;
  }
  .topbar a.back{
    color:var(--muted);text-decoration:none;font-size:.9rem;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;
    transition:color .2s ease;
  }
  .topbar a.back:hover{color:var(--text);}
  .topbar .crumb{color:var(--muted);font-size:.9rem;}
  .topbar .crumb b{color:var(--text);}
  .topbar .deck-link{
    margin-left:auto;
    color:var(--accent);text-decoration:none;font-size:.9rem;font-weight:600;
    border:1px solid var(--border);padding:7px 14px;border-radius:9px;
    transition:border-color .2s ease;
  }
  .topbar .deck-link:hover{border-color:var(--accent);}

  /* ---- Layout ---- */
  .layout{
    display:grid;
    grid-template-columns:280px minmax(0,1fr);
    max-width:1240px;margin:0 auto;
  }
  /* ---- Sidebar TOC ---- */
  aside{
    position:sticky;top:53px;align-self:start;
    height:calc(100vh - 53px);
    overflow-y:auto;
    padding:30px 16px 30px 24px;
    border-right:1px solid var(--border);
  }
  aside .toc-title{
    font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);font-weight:700;margin-bottom:14px;
  }
  aside nav a{
    display:block;
    color:var(--muted);text-decoration:none;
    font-size:.88rem;
    padding:5px 10px;border-radius:7px;
    border-left:2px solid transparent;
    transition:color .15s ease, background .15s ease;
  }
  aside nav a:hover{color:var(--text);background:rgba(255,255,255,.03);}
  aside nav a.h3{padding-left:22px;font-size:.83rem;}
  aside nav a.active{color:var(--accent);border-left-color:var(--accent);background:rgba(88,166,255,.06);}

  /* ---- Content ---- */
  main{padding:46px 56px 120px;min-width:0;}
  article{max-width:820px;}
  #status{color:var(--muted);padding:40px 0;}

  article h1{font-size:2.2rem;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px;scroll-margin-top:70px;}
  article h2{font-size:1.6rem;margin:48px 0 16px;padding-top:8px;letter-spacing:-.01em;scroll-margin-top:70px;border-top:1px solid var(--border);padding-top:30px;}
  article h3{font-size:1.22rem;margin:32px 0 12px;color:#d7e2ec;scroll-margin-top:70px;}
  article h4{font-size:1.02rem;margin:24px 0 10px;color:var(--accent-2);}
  article p{margin:0 0 16px;}
  article ul,article ol{margin:0 0 16px 24px;}
  article li{margin:6px 0;}
  article strong{color:#fff;}
  article hr{border:none;border-top:1px solid var(--border);margin:36px 0;}

  article blockquote{
    border-left:3px solid var(--analogy);
    background:rgba(188,140,255,.06);
    padding:14px 20px;margin:0 0 20px;border-radius:0 10px 10px 0;
    color:#d8c9f0;
  }
  article blockquote p{margin:0 0 8px;}
  article blockquote p:last-child{margin:0;}

  article code{
    background:var(--code-bg);
    border:1px solid var(--border);
    padding:2px 6px;border-radius:6px;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    font-size:.88em;color:#e3b341;
  }
  article pre{
    background:var(--code-bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;margin:0 0 20px;
    overflow-x:auto;
  }
  article pre code{background:none;border:none;padding:0;color:#cdd9e5;font-size:.86rem;line-height:1.6;}

  article table{
    width:100%;border-collapse:collapse;margin:0 0 24px;font-size:.92rem;
    border:1px solid var(--border);border-radius:10px;overflow:hidden;
  }
  article th,article td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);}
  article th{background:var(--bg-2);font-weight:700;color:#fff;}
  article tr:last-child td{border-bottom:none;}
  article td{color:var(--muted);}

  article a{text-decoration:none;border-bottom:1px solid rgba(88,166,255,.35);}
  article a:hover{border-bottom-color:var(--accent);}

  /* ---- Mobile ---- */
  .menu-toggle{display:none;}
  @media (max-width:880px){
    .layout{grid-template-columns:1fr;}
    aside{
      position:fixed;top:53px;left:0;width:280px;z-index:15;
      background:var(--bg);transform:translateX(-105%);transition:transform .25s ease;
      box-shadow:var(--shadow);
    }
    aside.open{transform:none;}
    main{padding:30px 22px 100px;}
    .menu-toggle{
      display:inline-flex;align-items:center;gap:7px;
      background:none;border:1px solid var(--border);color:var(--text);
      padding:7px 12px;border-radius:9px;font-size:.85rem;cursor:pointer;
    }
  }
</style>
</head>
<body>
  <div class="topbar">
    <a class="back" href="index.html">&larr; Inicio</a>
    <button class="menu-toggle" id="menuToggle">☰ Índice</button>
    <span class="crumb">Wiki · <b id="crumb">Módulo</b></span>
    <a class="deck-link" id="deckLink" href="#" target="_blank" rel="noopener">Ver presentación →</a>
  </div>

  <div class="layout">
    <aside id="sidebar">
      <div class="toc-title">En esta página</div>
      <nav id="toc"></nav>
    </aside>
    <main>
      <article id="content"><p id="status">Cargando wiki…</p></article>
    </main>
  </div>

<!-- Renderizador de Markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  const MODULE_FILES = {
    "1": { file: "modulo-1/wiki.md", deck: "modulo-1/presentacion.html", title: "Módulo 1" },
    "2": { file: "modulo-2/wiki.md", deck: "modulo-2/presentacion.html", title: "Módulo 2" },
    "3": { file: "modulo-3/wiki.md", deck: "modulo-3/presentacion.html", title: "Módulo 3" },
    "4": { file: "modulo-4/wiki.md", deck: "modulo-4/presentacion.html", title: "Módulo 4" },
    "5": { file: "modulo-5/wiki.md", deck: "modulo-5/presentacion.html", title: "Módulo 5" },
    "6": { file: "modulo-6/wiki.md", deck: "modulo-6/presentacion.html", title: "Módulo 6" },
    "7": { file: "modulo-7/wiki.md", deck: "modulo-7/presentacion.html", title: "Módulo 7" }
  };

  const params = new URLSearchParams(location.search);
  const m = params.get("m") || "1";
  const cfg = MODULE_FILES[m] || MODULE_FILES["1"];

  document.getElementById("crumb").textContent = cfg.title;
  document.getElementById("deckLink").href = cfg.deck;
  document.title = `Wiki ${cfg.title} — Fundamentos de IA Productiva`;

  function slugify(text){
    return text.toLowerCase().trim()
      .normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^\w\s-]/g,"").replace(/\s+/g,"-").replace(/-+/g,"-");
  }

  fetch(cfg.file)
    .then(r => { if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => {
      const content = document.getElementById("content");
      content.innerHTML = marked.parse(md);

      // Reescribir links internos a otras wikis (.md -> wiki.html?m=N)
      content.querySelectorAll('a[href$=".md"]').forEach(a => {
        const href = a.getAttribute("href");
        const match = href.match(/modulo-(\d+)-wiki\.md/);
        if(match){ a.setAttribute("href", `wiki.html?m=${match[1]}`); }
      });

      // Quitar la Tabla de Contenidos embebida (usamos el índice lateral)
      const headings = [...content.querySelectorAll("h1,h2,h3,h4")];
      const tocHeading = headings.find(h => /tabla de contenidos/i.test(h.textContent));
      if(tocHeading){
        let node = tocHeading.nextElementSibling;
        tocHeading.remove();
        // eliminar la lista del TOC y el <hr> que le sigue
        while(node && !/^H[1-4]$/.test(node.tagName)){
          const next = node.nextElementSibling;
          node.remove();
          node = next;
        }
      }

      // Asignar ids y construir el índice lateral (h2 y h3)
      const toc = document.getElementById("toc");
      const used = {};
      content.querySelectorAll("h2,h3").forEach(h => {
        let id = slugify(h.textContent);
        if(used[id]){ used[id]++; id = `${id}-${used[id]}`; } else { used[id] = 1; }
        h.id = id;
        const link = document.createElement("a");
        link.href = `#${id}`;
        link.textContent = h.textContent;
        if(h.tagName === "H3") link.classList.add("h3");
        link.addEventListener("click", () => { if(window.innerWidth <= 880) closeSidebar(); });
        toc.appendChild(link);
      });

      setupScrollSpy(content);
    })
    .catch(err => {
      document.getElementById("status").innerHTML =
        `No se pudo cargar la wiki (<code>${cfg.file}</code>): ${err.message}.<br>
         Si abriste el archivo con doble clic, sírvelo por HTTP — en Netlify funcionará. Localmente: <code>python3 -m http.server</code>.`;
    });

  // Scroll spy: resalta la sección activa en el índice
  function setupScrollSpy(content){
    const links = [...document.querySelectorAll("#toc a")];
    const map = {};
    links.forEach(l => map[l.getAttribute("href").slice(1)] = l);
    const targets = content.querySelectorAll("h2,h3");
    const observer = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if(e.isIntersecting){
          links.forEach(l => l.classList.remove("active"));
          if(map[e.target.id]) map[e.target.id].classList.add("active");
        }
      });
    }, { rootMargin: "-70px 0px -75% 0px" });
    targets.forEach(t => observer.observe(t));
  }

  // Sidebar móvil
  const sidebar = document.getElementById("sidebar");
  function closeSidebar(){ sidebar.classList.remove("open"); }
  document.getElementById("menuToggle").addEventListener("click", () => sidebar.classList.toggle("open"));
</script>
</body>
</html>
